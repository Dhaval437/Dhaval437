name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"     # every day at midnight UTC
  workflow_dispatch:         # lets you run it manually
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Dhaval437
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF69B4&color_dots=#1A1A2E,#4A2B3D,#8A4A6B,#EF93C4,#F8BBD0
            dist/snake-light.svg?palette=github-light&color_snake=#EF93C4&color_dots=#FFEFF6,#F8BBD0,#EF93C4,#FF69B4,#C2185B

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
